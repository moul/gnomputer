<!doctype html>
<html lang="en" data-theme="ascii-light">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages cannot set response headers, so this is a meta CSP.
         Two consequences worth knowing: frame-ancestors is ignored in meta
         form (clickjacking protection would need a real header), and the
         policy applies only once the document starts parsing.

         What this genuinely buys, given those limits:
           script-src 'self'  blocks injected inline and remote script,
                              which is the main XSS payload path. The app
                              has no inline script at all, so this costs
                              nothing.
           object-src 'none'  no plugins, no <embed>.
           base-uri 'self'    a base tag cannot be injected to repoint every
                              relative URL on the page.

         connect-src and frame-src are deliberately wide. Custom networks let
         you point the app at any RPC endpoint you run, including a local one
         over http, so an allowlist here would either break that feature or
         be a list of every host anyone might use — which is not a control.
         Saying so is more useful than a directive that looks strict and
         isn't. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src *; frame-src https: http:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- One origin only: the default network's RPC, which is the app's own
         backend rather than an optional third party. Not the indexer, not
         gnoweb, not Gnockpit, not GitHub — a hint per configured service
         would leak a visit to each of them for no measurable gain.

         Measured against the deployed site, five loads each: time to the
         first RPC response went from a 436ms median to 367ms. Roughly
         70ms, ~16%. It does not show up locally (2ms) or against a
         throttled local server — the win only exists against real CDN and
         TLS latency, so anyone re-measuring this on localhost will
         conclude, wrongly, that it does nothing.

         The cost, stated: this fires before any JavaScript, so a visitor
         who has switched to their own node still opens one idle
         connection to Topaz. See #150. -->
    <link rel="preconnect" href="https://rpc.topaz.testnets.gno.land" crossorigin />
    <!-- Theme-aware: the manifest declares a single dark theme_color, which
         looked wrong against the light default. These let the browser chrome
         follow whichever scheme the visitor is actually in. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />
    <meta
      name="description"
      content="A windowed desktop for gno.land — browse realms, read their source and on-chain state, and watch the chain live, entirely in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest's icons; without this an installed app gets
         a screenshot of the page as its home-screen icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gnomputer" />
    <meta property="og:title" content="Gnomputer — Boot the shared computer." />
    <meta
      property="og:description"
      content="A windowed desktop for gno.land — browse realms, read their source and on-chain state, and watch the chain live, entirely in your browser."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Gnomputer — Boot the shared computer.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
