name: Setup toolchain
description: >-
  pnpm, Node, the turbo cache and an installed workspace. Every CI job needs
  exactly this, and six copies of it drifted apart one edit at a time
  (AUD-052).

  Checkout stays in the caller: a local composite action can only be found
  once the repository is already on disk.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "20"
        cache: "pnpm"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: "**/.turbo"
        # Keyed on the exact commit so a rerun of the same SHA is a hit, with
        # progressively looser fallbacks: same lockfile first (dependencies
        # unchanged), then anything for this OS.
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-
    - run: pnpm install --frozen-lockfile
      shell: bash
